spring:
  application:
    name: ai-for-developers-project-386
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

calendar:
  owner:
    name: "${CALENDAR_OWNER_NAME:Владелец календаря}"
    email: "${CALENDAR_OWNER_EMAIL:owner@example.com}"
