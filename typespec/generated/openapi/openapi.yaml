openapi: 3.0.0
info:
  title: Booking API
  description: API для управления бронированиями
  version: 0.0.0
tags:
  - name: Bookings
paths:
  /api/bookings:
    get:
      operationId: Bookings_list
      description: Получить список бронирований
      parameters:
        - name: $skip
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: $top
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Bookings
    post:
      operationId: Bookings_create
      description: Создать бронирование
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
  /api/bookings/{id}:
    get:
      operationId: Bookings_get
      description: Получить бронирование по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Bookings
    patch:
      operationId: Bookings_updateStatus
      description: Обновить статус бронирования
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/EventType'
              required:
                - status
    delete:
      operationId: Bookings_delete
      description: Удалить бронирование
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Bookings
components:
  schemas:
    Booking:
      type: object
      required:
        - id
        - eventId
        - userName
        - userEmail
        - seats
        - status
        - createdAt
      properties:
        id:
          type: string
          description: Уникальный идентификатор
        eventId:
          type: string
          description: ID события
        userName:
          type: string
          description: Имя пользователя
        userEmail:
          type: string
          description: Email пользователя
        seats:
          type: integer
          format: int32
          description: Количество мест
        status:
          allOf:
            - $ref: '#/components/schemas/EventType'
          description: Статус бронирования
        createdAt:
          type: string
          format: date-time
          description: Дата создания
      description: Бронирование
    BookingRequest:
      type: object
      required:
        - eventId
        - userName
        - userEmail
        - seats
      properties:
        eventId:
          type: string
          description: ID события
        userName:
          type: string
          description: Имя пользователя
        userEmail:
          type: string
          description: Email пользователя
        seats:
          type: integer
          format: int32
          description: Количество мест
      description: Запрос на создание бронирования
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Описание ошибки
      description: Ошибка
    EventType:
      type: string
      enum:
        - created
        - confirmed
        - cancelled
        - completed
      description: Тип события
    PagedResult:
      type: object
      required:
        - items
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
          description: Список бронирований
        totalCount:
          type: integer
          format: int32
          description: Общее количество
      description: Результат с пагинацией
