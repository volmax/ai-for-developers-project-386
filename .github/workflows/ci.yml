name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install mise
        run: curl https://mise.run | MISE_INSTALL_PATH=/usr/local/bin/mise bash -s v2026.11.2

      - name: Run checks
        run: mise run check

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install mise
        run: curl https://mise.run | MISE_INSTALL_PATH=/usr/local/bin/mise bash -s v2026.11.2

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@c477387a9ff3571fa00c2e1bff71cb9b33b82cb9 # v3.10.0

      - name: Run full verification (lint + types + unit tests + E2E)
        run: mise run verify
