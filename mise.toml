[settings]
experimental = true

[tools]
java = "temurin-21"
maven = "3.9"
node = "22"
python = "3.12"
hk = "latest"
hadolint = "2.15.1"
jactionlint = "2.4.0"
typos = "1.52.0"
betterleaks = "1.9.0"
osv-scanner = "2.7.0"

[env]
_.file = ".env"
SPRING_PROFILES_ACTIVE = "dev"

[tasks.install]
description = "Install all dependencies"
run = [
  "cd backend && mvn dependency:go-offline -B",
  "cd frontend && npm install",
  "cd typespec && npm install",
  "pip install check-jsonschema",
]

[tasks.build]
description = "Build both projects"
run = [
  "cd backend && mvn package -DskipTests -B",
  "cd frontend && npm run build",
]

[tasks.test]
description = "Run all tests"
run = [
  "cd backend && mvn test -B",
  "cd frontend && npm run test:run",
]

[tasks.check]
description = "Lint, type check, format check, security scans"
run = [
  "mise run install",
  "cd backend && mise x hadolint -- hadolint Dockerfile",
  "cd backend && mvn spotless:check -B",
  "cd backend && mvn compile -B",
  "cd frontend && mise x hadolint -- hadolint Dockerfile",
  "cd frontend && npm run lint",
  "cd frontend && npm run format",
  "cd frontend && npm run knip",
  "mise x jactionlint -- jactionlint --ignore=pipeline-without-pipefail --ignore=unverified-download .github/workflows/ci.yml .github/workflows/hexlet-check.yml",
  "mise x typos -- typos",
  "mise x betterleaks -- betterleaks dir . --no-banner",
  "mise x python -- check-jsonschema --schemafile frontend/node_modules/oxlint/configuration_schema.json frontend/oxlint.json",
  "mise x python -- check-jsonschema --schemafile frontend/node_modules/knip/schema.json frontend/knip.json",
  "mise x python -- check-jsonschema --schemafile https://json.schemastore.org/tsconfig frontend/tsconfig.json",
  "mise x python -- check-jsonschema --schemafile https://json.schemastore.org/package.json frontend/package.json",
  "osv-scanner scan source --config=./.osv-scanner.toml -L ./frontend/package-lock.json",
  "osv-scanner scan source --config=./.osv-scanner.toml --no-resolve -L ./backend/pom.xml",
  "mise run check:contract",
]

[tasks."start:backend"]
description = "Start Spring Boot backend"
run = "cd backend && mvn spring-boot:run -B"

[tasks."start:frontend"]
description = "Start Vite frontend dev server"
run = "cd frontend && npm run dev"

[tasks.clean]
description = "Clean build artifacts"
run = [
  "cd backend && mvn clean",
  "cd frontend && rm -rf dist",
]

[tasks.fix]
description = "Auto-fix formatting and linting issues"
run = [
  "cd backend && mvn spotless:apply -B",
  "cd frontend && npm run format:fix",
]

[tasks."install:typespec"]
description = "Install TypeSpec dependencies"
run = "cd typespec && npm install"

[tasks."install:contract"]
description = "Install TypeSpec dependencies"
dir = "typespec"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci"

[tasks."check:contract"]
description = "Generate OpenAPI and TypeScript client, verify no diff"
depends = ["install:contract"]
dir = "typespec"
run = "npm run check"

[daemons.backend]
run = "cd backend && mvn spring-boot:run -B"
ready_port = 8080

[daemons.frontend]
run = "cd frontend && npm run dev"
ready_port = 5173
